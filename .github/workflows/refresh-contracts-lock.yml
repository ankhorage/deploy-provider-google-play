name: Refresh Contracts Lock

on:
  push:
    branches:
      - feat/google-play-deployment-provider

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - name: Commit lockfile
        run: |
          if git diff --quiet bun.lock; then
            exit 0
          fi
          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh contracts lock [lock]"
          git push origin HEAD:feat/google-play-deployment-provider
